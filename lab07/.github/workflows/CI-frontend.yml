on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'       
      - '!.github/**'       
      - '!documentacion/**' 

jobs:
  call-reusable-ci:
    name: 📦 Invocar CI Reutilizable
    uses: ./.github/workflows/reusable-linter-test.yml
    with:
      component_name: 'Frontend Angular/React App'

  reporting-frontend:
    name: 📝 Generar Reporte de Optimización
    needs: call-reusable-ci
    runs-on: ubuntu-latest
    steps:
      - name: Crear Resumen de Ejecución Selectiva
        run: |
          echo "## 📊 Reporte de Pipeline Monorepo (Frontend)" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "* *Componente Afectado:* \frontend/\ 💻" >> $GITHUB_STEP_SUMMARY
          echo "* *Pipeline Ejecutado:* \CI-frontend.yml\" >> $GITHUB_STEP_SUMMARY
          echo "* *Jobs Omitidos de Forma Optimizada:* Backend CI & Infraestructura CI" >> $GITHUB_STEP_SUMMARY
          echo "* *Estrategia Aplicada:* Paths-filtering a nivel de trigger nativo. ⚡" >> $GITHUB_STEP_SUMMARY